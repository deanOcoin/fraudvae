# /etc/nginx/sites-available/fraudvae - the public face of the demonstration.
# install.sh fills in DOMAIN / NAMES / APPNAMES and the certificate lines (certbot certonly).
#
# Two layers of limiting: this file caps request rate and body size per address before
# anything reaches python; the app has its own, finer, per-endpoint token buckets and a
# ceiling on how many transactions score at once.

limit_req_zone $binary_remote_addr zone=fv_score:10m rate=90r/m;   # /api/score (the app allows 60/min + burst)
limit_req_zone $binary_remote_addr zone=fv_batch:10m rate=6r/m;    # /api/score/batch (the app allows 4/min)
limit_req_zone $binary_remote_addr zone=fv_api:10m   rate=300r/m;  # everything else under /api
limit_conn_zone $binary_remote_addr zone=fv_conn:10m;

server_tokens off;

# the access log keeps the network, not the address: the last octet of an ipv4 address and the
# second half of an ipv6 one are dropped before the line is written. Enough to see traffic
# patterns and nothing that identifies a visitor
map $remote_addr $fv_anon {
    default                      0.0.0.0;
    "~^(?P<a>\d+\.\d+\.\d+)\.\d+$" $a.0;
    "~^(?P<b>[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}:[0-9a-fA-F]{0,4}):.*$" $b::;
}
log_format fv_anon '$fv_anon - [$time_local] "$request" $status $body_bytes_sent "$http_referer" "$http_user_agent" $request_time';

upstream fraudvae_app {
    server 127.0.0.1:8765;
    keepalive 16;
}

# the read-only answers (run metrics, the latent map, the model timeline, the corpus statistics)
# change only when a run is added: nginx keeps them for ten minutes so a scanner asking for a
# three-megabyte latent map three hundred times a minute costs python one serialisation.
# (/api/examples picks a random row and /api/meta carries the uptime: those stay live)
proxy_cache_path /var/cache/nginx/fraudvae levels=1:2 keys_zone=fv_cache:10m max_size=200m inactive=1h use_temp_path=off;

# the api subdomain's root goes to the interactive api docs
map $host $fv_api_root {
    default 0;
    "~^api\." 1;
}

# a request for any other name (or for the bare ip) gets no answer at all: no redirect to
# a host an attacker chose, no certificate handed to a scanner
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name _;
    ssl_reject_handshake on;
}

server {
    listen 80;
    listen [::]:80;
    server_name NAMES;

    # certbot's challenge, then everything to https once the certificate exists
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

# the bare domain is the www host
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name DOMAIN;
    # ssl_certificate / ssl_certificate_key: written by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://www.DOMAIN$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name APPNAMES;

    # ssl_certificate / ssl_certificate_key: written by certbot
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    access_log /var/log/nginx/fraudvae.access.log fv_anon;
    error_log  /var/log/nginx/fraudvae.error.log;

    client_max_body_size 6m;          # a 5,000-row csv with the wide columns is well under this
    client_body_timeout 20s;
    client_header_timeout 20s;
    send_timeout 30s;
    keepalive_timeout 30s;
    limit_conn fv_conn 20;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # the site loads nothing from anywhere else: every script, style, font and library is
    # served from this origin (fraudvae/web/vendor), so scripts can be limited to 'self' -
    # an injected <script> would not run even if some markup escaped the app's escaping
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Resource-Policy same-site always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;          # a six-generation comparison on a cold cache can take a few seconds; a batch more
    proxy_connect_timeout 5s;

    # nothing under a dot-directory is ever served (there is none in the app's static tree; this
    # is for the day something is put there by mistake)
    location ~ /\.(?!well-known) { return 404; }

    location = /api/score {
        limit_req zone=fv_score burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://fraudvae_app;
    }
    location = /api/score/batch {
        limit_req zone=fv_batch burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://fraudvae_app;
    }
    location ~ ^/api/(runs|models|datasets|schema|configs|openapi\.json)(/|$) {
        limit_req zone=fv_api burst=100 nodelay;
        limit_req_status 429;
        proxy_cache fv_cache;
        proxy_cache_methods GET HEAD;
        proxy_cache_key "$host$request_uri";
        proxy_cache_valid 200 10m;
        proxy_cache_valid 404 1m;
        proxy_cache_lock on;
        proxy_cache_use_stale updating error timeout;
        proxy_ignore_headers Cache-Control Expires;
        add_header X-Cache $upstream_cache_status;
        # add_header in a location replaces the server's set: repeat the ones that matter
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
        add_header Cross-Origin-Resource-Policy same-site always;
        proxy_pass http://fraudvae_app;
    }
    location /api/ {
        limit_req zone=fv_api burst=100 nodelay;
        limit_req_status 429;
        proxy_pass http://fraudvae_app;
    }
    location /static/ {
        proxy_pass http://fraudvae_app;
        expires 10m;
    }
    location = / {
        if ($fv_api_root) { return 302 /api/docs; }
        proxy_pass http://fraudvae_app;
    }
    location / {
        proxy_pass http://fraudvae_app;
    }
}
