# v7f: v7e (the best of a-c, v7a, plus the supervised head) with the blender fit without the VAE's columns
# (boost.blend_without_vae): what the novelty side is worth at the operating point once the booster carries the
# encoder's block and the head. Session A (v7), built from v5-h200-e on `full`.
#   fraudvae post v7-f --config v7f --prepared full --device cuda:1    (from a copy of v5-h200-e)
name: v7f
device: cuda
model:
  latent_dim: 24
  hidden: [768, 768, 384]
  cat_embed_dim: 10
  source_embed_dim: 8
  dropout: 0.05
  history:
    enabled: true
    window: 32
    d_model: 128
    layers: 2
    heads: 4
train:
  epochs: 30
  batch_size: 8192
  lr: 0.0015
  beta_warmup_epochs: 5
  patience: 8
  select_by: elbo
  score_samples: 16
  amp: false
boost:
  max_legit_per_source: 200000
  val_legit_per_source: 100000
  legit_weight_cap: 3.0
  learning_rate: 0.03
  max_rounds: 3000
  early_stopping: 200
  num_threads: 32       # two post stages share the box's cores
  txfm_features: true
  txfm_head: true       # the supervised head on the block, the txsup blend signal
  blend_without_vae: true   # the blender on the booster, the one-hot and the extra signals alone
txfm:
  run: txfm-base-last   # the 60k encoder of the node run (runs/txfm-base-last/txfm.pt)
  window: 128
  sources: [tabformer, fdh]   # the block for these sources only, NaN for the rest
notes: Session A variant v7f, v7e (v7-a + head) with the blender fit without the VAE's columns
