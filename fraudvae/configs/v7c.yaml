# v7c: v6_full with the encoder's block as 64 principal components plus the mean surprise for every source, the
# second answer to feature dilution. Session A (v7), one of the post-stage variants
# built from the v5-h200-e checkpoint on the `full` set; see docs/TRAINING_NOTES.md (v7).
#   fraudvae post v7-c --config v7c --prepared full --device cuda:0    (from a copy of v5-h200-e)
name: v7c
device: cuda
model:
  latent_dim: 24
  hidden: [768, 768, 384]
  cat_embed_dim: 10
  source_embed_dim: 8
  dropout: 0.05
  history:
    enabled: true
    window: 32
    d_model: 128
    layers: 2
    heads: 4
train:
  epochs: 30
  batch_size: 8192
  lr: 0.0015
  beta_warmup_epochs: 5
  patience: 8
  select_by: elbo
  score_samples: 16
  amp: false
boost:
  max_legit_per_source: 200000
  val_legit_per_source: 100000
  legit_weight_cap: 3.0
  learning_rate: 0.03
  max_rounds: 3000
  early_stopping: 200
  num_threads: 32       # two post stages share the box's cores
  txfm_features: true
  txfm_pca: 64          # the block compressed before the trees see it (txfm_pca.npz in the run)
txfm:
  run: txfm-base-last   # the 60k encoder of the node run (runs/txfm-base-last/txfm.pt)
  window: 128
notes: Session A variant v7c; the v6 base is v6_full, the comparison is fraudvae compare against v5-h200-h and v6-base-e
