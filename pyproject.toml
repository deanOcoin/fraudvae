[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudvae"
version = "0.5.1"
description = "Variational autoencoder for payment fraud screening, trained on a merged corpus of public transaction datasets, with a web UI for inference and (remote) training"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dean Mostafa" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "torch>=2.4",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
    "paramiko>=3.3",
    "cryptography>=41",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "asyncssh>=2.14", "ruff>=0.5"]
kaggle = ["kaggle>=1.5"]

[project.scripts]
fraudvae = "fraudvae.cli:main"

[tool.setuptools.packages.find]
include = ["fraudvae*"]

[tool.setuptools.package-data]
# everything the installed package needs at run time: the ui, the training configs, the
# pretrained-bundle manifest, the corpus statistics and the raw-file checksums
fraudvae = ["web/**/*", "configs/*.yaml", "*.json", "data/*.json", "data/taxonomy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["slow: trains the two-epoch smoke model first (about a minute); `pytest -m 'not slow'` is the quick loop"]

[tool.ruff]
line-length = 160
target-version = "py310"

[tool.ruff.lint]
# pyflakes plus the pycodestyle errors that are bugs rather than taste. The code puts two short
# statements on a line and names a loop variable l where it reads well; those stay.
select = ["E4", "E7", "E9", "F"]
ignore = ["E702", "E731", "E741"]
