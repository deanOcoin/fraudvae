[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fraudvae"
version = "0.5.0"
description = "Variational autoencoder for payment fraud screening, trained on a merged corpus of public transaction datasets, with a web UI for inference and (remote) training"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Dean Mostafa" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "torch>=2.4",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pyyaml>=6",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "python-multipart>=0.0.6",
    "paramiko>=3.3",
    "cryptography>=41",
    "httpx>=0.25",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "asyncssh>=2.14"]
kaggle = ["kaggle>=1.5"]

[project.scripts]
fraudvae = "fraudvae.cli:main"

[tool.setuptools.packages.find]
include = ["fraudvae*"]

[tool.setuptools.package-data]
fraudvae = ["web/**/*", "data/taxonomy/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
